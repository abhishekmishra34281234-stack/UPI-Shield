<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>UPI-Shield Fraud Detector</title>
    <style>
        body { font-family: Arial, sans-serif; background: #0f172a; color: #f8fafc; display: flex; justify-content: center; padding-top: 50px; }
        .container { background: #1e293b; padding: 30px; border-radius: 12px; width: 500px; box-shadow: 0 4px 20px rgba(0,0,0,0.5); }
        textarea { width: 100%; height: 100px; background: #334155; border: 1px solid #475569; color: white; border-radius: 6px; padding: 10px; box-sizing: border-box; }
        button { width: 100%; padding: 10px; background: #3b82f6; border: none; color: white; font-weight: bold; border-radius: 6px; margin-top: 10px; cursor: pointer; }
        button:hover { background: #2563eb; }
        .result { margin-top: 20px; padding: 15px; border-radius: 6px; }
        .safe { background: #14532d; border: 1px solid #22c55e; }
        .risk { background: #7f1d1d; border: 1px solid #ef4444; }
    </style>
</head>
<body>
    <div class="container">
        <h2>🛡️ UPI-Shield Detector</h2>
        <form method="POST">
            <textarea name="message" placeholder="Paste suspicious SMS or message here..." required>{{ text }}</textarea>
            <button type="submit">Analyze Message</button>
        </form>

        {% if result %}
        <div class="result {% if result.risk_score >= 60 %}risk{% else %}safe{% endif %}">
            <h3>Status: {{ result.status }}</h3>
            <p><strong>Risk Score:</strong> {{ result.risk_score }}%</p>
            {% if result.reasons %}
            <p><strong>Flags Triggered:</strong></p>
            <ul>
                {% for r in result.reasons %}
                <li>{{ r }}</li>
                {% endfor %}
            </ul>
            {% endif %}
        </div>
        {% endif %}
    </div>
</body>
</html>
